<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>creative 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@500;700&display=swap">
<style>
  html{zoom:2}html,body{margin:0;background:#050505;}
  .c{position:relative;width:520px;height:620px;overflow:hidden;background:#111111;font-family:Manrope,sans-serif;}
  .type{position:absolute;left:-14px;top:14px;width:600px;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:132px;line-height:.86;letter-spacing:-.03em;text-transform:uppercase;
     color:transparent;-webkit-text-stroke:1.5px rgba(199,174,94,.55);white-space:nowrap;}
  .type .solid{color:#f4f4f4;-webkit-text-stroke:0;}
  .type .dim{-webkit-text-stroke:1.5px rgba(199,174,94,.22);}
  .glow{position:absolute;left:50%;bottom:-120px;width:760px;height:420px;transform:translateX(-50%);
     background:radial-gradient(closest-side, rgba(199,174,94,.34) 0%, rgba(199,174,94,.10) 45%, rgba(199,174,94,0) 75%);}
  .row{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center;align-items:flex-end;gap:26px;}
  .v{width:92px;height:165px;overflow:hidden;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55));}
  .v.mid{width:104px;height:187px;}
  .v img{display:block;width:100%;height:auto;}
  .eyebrow{position:absolute;left:36px;top:318px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#c7ae5e;font-weight:700;}
  .sub{position:absolute;left:36px;top:336px;font-family:Fraunces,Georgia,serif;font-size:26px;line-height:1.1;color:#ffffff;letter-spacing:-.01em;}
  .sub em{font-style:italic;color:#c7ae5e;}
  .ruo{position:absolute;left:36px;bottom:16px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8a8a8a;font-weight:700;}
  .mark{position:absolute;right:36px;bottom:12px;font-family:Fraunces,Georgia,serif;font-size:13px;letter-spacing:.34em;color:#c9c9c9;}
</style></head>
<body>
<div class="c">
  <div class="type"><span class="dim">New in</span><br><span class="solid">New in</span><br><span>New in</span></div>
  <div class="glow"></div>
  <div class="eyebrow">Catalogue</div>
  <div class="sub">Three additions, <em>one standard.</em></div>
  <div class="row">
    <div class="v"><img src="vials/bpc-157-tb-500.png" alt=""></div>
    <div class="v mid"><img src="vials/ghk-cu.png" alt=""></div>
    <div class="v"><img src="vials/nad.png" alt=""></div>
  </div>
  <div class="ruo">Research use only</div>
  <div class="mark">VANTA</div>
</div>
</body></html>
