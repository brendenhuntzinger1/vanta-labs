<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>creative 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@500;700&display=swap">
<style>
  html{zoom:2}html,body{margin:0;background:#050505;}
  .c{position:relative;width:520px;height:640px;overflow:hidden;background:#0a0a0a;font-family:Manrope,sans-serif;}
  .glow{position:absolute;left:50%;top:58%;width:620px;height:520px;transform:translate(-50%,-50%);
     background:radial-gradient(closest-side, rgba(199,174,94,.42) 0%, rgba(199,174,94,.14) 38%, rgba(199,174,94,0) 72%);}
  .floor{position:absolute;left:0;right:0;bottom:0;height:150px;
     background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.035) 100%);}
  .vialwrap{position:absolute;left:50%;bottom:78px;width:140px;transform:translateX(-50%);}
  .vial{width:140px;height:250px;overflow:hidden;}
  .vial img{display:block;width:140px;height:auto;}
  .refl{width:140px;height:90px;overflow:hidden;opacity:.18;transform:scaleY(-1);
     -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 100%);mask-image:linear-gradient(180deg, transparent 0%, #000 100%);}
  .refl img{display:block;width:140px;height:auto;margin-top:-158px;}
  .eyebrow{position:absolute;left:36px;top:40px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#c7ae5e;font-weight:700;}
  h1{position:absolute;left:36px;top:62px;margin:0;font-family:Fraunces,Georgia,serif;font-weight:400;font-size:56px;line-height:1;letter-spacing:-.02em;color:#ffffff;width:450px;}
  h1 em{font-style:italic;color:#c7ae5e;}
  .hair{position:absolute;left:36px;right:36px;top:206px;height:1px;background:linear-gradient(90deg, rgba(199,174,94,.6), rgba(199,174,94,0));}
  .ruo{position:absolute;left:36px;bottom:30px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8a8a8a;font-weight:700;}
  .mark{position:absolute;right:36px;bottom:26px;font-family:Fraunces,Georgia,serif;font-size:13px;letter-spacing:.34em;color:#c9c9c9;}
  .lot{position:absolute;right:36px;top:46px;font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.12em;color:#8a8a8a;}
</style></head>
<body>
<div class="c">
  <div class="glow"></div>
  <div class="floor"></div>
  <div class="vialwrap">
    <div class="vial"><img src="vials/ghk-cu.png" alt=""></div>
    <div class="refl"><img src="vials/ghk-cu.png" alt=""></div>
  </div>
  <div class="eyebrow">COA library</div>
  <h1>Every batch,<br><em>documented.</em></h1>
  <div class="hair"></div>
  <div class="ruo">Research use only</div>
  <div class="mark">VANTA</div>
</div>
</body></html>
