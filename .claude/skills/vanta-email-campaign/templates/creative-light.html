<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>creative 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@500;700&display=swap">
<style>
  html{zoom:2}html,body{margin:0;background:#050505;}
  .c{position:relative;width:520px;height:600px;overflow:hidden;
     background:radial-gradient(120% 90% at 50% 78%, #e9e9e9 0%, #cfcfcf 45%, #a9a9a9 100%);
     font-family:Manrope,sans-serif;}
  .photo{position:absolute;left:50%;bottom:-6px;width:392px;transform:translateX(-50%);
     -webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 60%, #000 55%, transparent 100%);
     mask-image:radial-gradient(ellipse 62% 70% at 50% 60%, #000 55%, transparent 100%);}
  .photo img{display:block;width:100%;height:auto;}
  .eyebrow{position:absolute;left:36px;top:40px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#3a3a3a;font-weight:700;}
  h1{position:absolute;left:36px;top:62px;margin:0;font-family:Fraunces,Georgia,serif;font-weight:400;font-size:64px;line-height:.98;letter-spacing:-.02em;color:#141414;width:440px;}
  h1 em{font-style:italic;font-weight:400;color:#8a7434;}
  .ruo{position:absolute;left:36px;bottom:30px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#4a4a4a;font-weight:700;}
  .mark{position:absolute;right:36px;bottom:26px;font-family:Fraunces,Georgia,serif;font-size:13px;letter-spacing:.34em;color:#2a2a2a;}
</style></head>
<body>
<div class="c">
  <div class="photo"><img src="products/ghk-cu.jpg" alt=""></div>
  <div class="eyebrow">GHK-Cu · 50 mg · Lyophilized</div>
  <h1>Back in<br><em>stock.</em></h1>
  <div class="ruo">Research use only</div>
  <div class="mark">VANTA</div>
</div>
</body></html>
